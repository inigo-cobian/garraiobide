<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garraiobide - Map Viewer</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Leaflet.draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

  <!-- Application CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" role="application" aria-label="Interactive map"></div>

  <div id="line-report" class="line-report" aria-label="Line station report">
    <h2 class="line-report__title">Line Report</h2>
    <label class="line-report__select-label" for="line-select">Select a line:</label>
    <select id="line-select" class="line-report__select" aria-label="Select a transit line">
      <option value="">-- Choose a line --</option>
    </select>
    <ol id="station-list" class="line-report__station-list" aria-live="polite"></ol>
    <p id="line-report-empty" class="line-report__empty" hidden>No station sequence available for this line.</p>
  </div>

  <div id="layer-control" class="layer-control" aria-label="Layer selector">
    <h2 class="layer-control__title">Layers</h2>
    <ul id="layer-list" class="layer-control__list"></ul>
    <div id="ingestion-panel" class="ingestion-panel">
      <h3 class="ingestion-panel__title">Import GTFS</h3>
      <input type="file" id="gtfs-file-input" accept=".zip"
             aria-label="GTFS file selector" />
      <button id="gtfs-submit-btn" disabled aria-label="Import GTFS">
        Import GTFS
      </button>
      <span id="gtfs-status" class="ingestion-panel__status" aria-live="polite"></span>
    </div>
  </div>

  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
