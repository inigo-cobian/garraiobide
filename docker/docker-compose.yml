services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.2.4
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo_data:/data/db
    secrets:
      - mongo_root_user
      - mongo_root_password
    networks:
      - db_network

  postgis:
    image: postgis/postgis:17-master
    container_name: postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: garraiobide
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_user
      - postgres_password
    networks:
      - db_network

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: transit_admin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_DB: garraiobide
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_DEBUG: "True"
    depends_on:
      - postgis
    secrets:
      - postgres_user
      - postgres_password
    networks:
      - db_network

secrets:
  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  mongo_data:
  postgis_data:

networks:
  db_network:
    driver: bridge