name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        type: string

  # Sundays at 05:00 UTC
  schedule:
    - cron: "0 5 * * 0"

jobs:
  integration-tests:
    # Run always UNLESS it's a push event whose commit message does NOT contain '[ci run]'.
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[ci run]')
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup C++ (Conan + CMake)
        uses: ./.github/actions/setup-cpp
        with:
          cmake_extra_flags: '-DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"'

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Run integration tests
        run: ctest --preset conan-debug --output-on-failure --tests-regex "MongoPersistence|MongoIntegration|MongoProperty"

      - name: Generate coverage report (LCOV)
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,unused
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors mismatch,unused
          lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors mismatch,unused
          lcov --remove coverage.info '*/adapters/mock*' --output-file coverage.info --ignore-errors mismatch,unused
          lcov --list coverage.info --ignore-errors mismatch,unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: integration
          fail_ci_if_error: false
